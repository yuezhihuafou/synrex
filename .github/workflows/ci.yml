name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}

    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture conformance
        run: pnpm architecture:check

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: pnpm test

      - name: Package install smoke test
        run: pnpm test:package-install

      - name: Doctor
        run: node dist/cli.js doctor

  dependency-security:
    name: Production dependency vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          install: false
      - name: Audit locked production dependencies (official registry)
        run: |
          pnpm audit --prod --audit-level high --registry https://registry.npmjs.org
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          cmp pnpm-lock.yaml deploy/release-lock.yaml
          # The immutable checked-in lock is compared to the shipped copy above.
          # Running pnpm install --offline on a fresh runner would need registry
          # metadata that this audit-only job intentionally has not downloaded.

  native-portable:
    name: Native package acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-native-install-isolated-owner-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shipped dependency lock is exactly the validated lock
        shell: bash
        run: cmp pnpm-lock.yaml deploy/release-lock.yaml
      - name: Validate types and native installer contracts
        run: |
          pnpm typecheck
          node --test deploy/portable-install.test.mjs deploy/portable-service.test.mjs
      - name: Validate packed CLI entrypoints
        run: pnpm test:package-install
      - name: Install, activate and verify the candidate tarball on native OS
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          archive_dir="$RUNNER_TEMP/synrex-native-qa-archive"
          prefix="$RUNNER_TEMP/synrex-native-qa-install"
          mkdir -p "$archive_dir"
          npm pack --ignore-scripts --silent --pack-destination "$archive_dir" > "$RUNNER_TEMP/package-name.txt"
          filename="$(tail -n 1 "$RUNNER_TEMP/package-name.txt")"
          test -n "$filename"
          archive="$archive_dir/$filename"
          digest="$(node -e 'const fs=require("node:fs"),c=require("node:crypto");process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$archive")"
          node deploy/portable-install.mjs --stage --version "$version" --prefix "$prefix" --source "$archive" --sha256 "$digest"
          node deploy/portable-install.mjs --activate --version "$version" --prefix "$prefix"
          node "$prefix/bin/synrex.mjs" --version
          node deploy/portable-install.mjs --status --prefix "$prefix"
          node deploy/portable-service.mjs --plan --prefix "$prefix"
