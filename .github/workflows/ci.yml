name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}

    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture conformance
        run: pnpm architecture:check

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: pnpm test

      - name: Package install smoke test
        run: pnpm test:package-install

      - name: Doctor
        run: node dist/cli.js doctor

  dependency-security:
    name: Production dependency vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          install: false
      - name: Audit locked production dependencies (official registry)
        run: |
          pnpm audit --prod --audit-level high --registry https://registry.npmjs.org
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          cmp pnpm-lock.yaml deploy/release-lock.yaml
          # The immutable checked-in lock is compared to the shipped copy above.
          # Running pnpm install --offline on a fresh runner would need registry
          # metadata that this audit-only job intentionally has not downloaded.

  native-portable:
    name: Native package acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-native-install-isolated-owner-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shipped dependency lock is exactly the validated lock
        shell: bash
        run: cmp pnpm-lock.yaml deploy/release-lock.yaml
      - name: Validate types and native installer contracts
        run: |
          pnpm typecheck
          node --test deploy/portable-install.test.mjs deploy/portable-service.test.mjs
      - name: Validate packed CLI entrypoints
        run: pnpm test:package-install
      - name: Install, activate and verify the candidate tarball on native OS
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          archive_dir="$RUNNER_TEMP/synrex-native-qa-archive"
          prefix="$RUNNER_TEMP/synrex-native-qa-install"
          mkdir -p "$archive_dir"
          npm pack --ignore-scripts --silent --pack-destination "$archive_dir" > "$RUNNER_TEMP/package-name.txt"
          filename="$(tail -n 1 "$RUNNER_TEMP/package-name.txt")"
          test -n "$filename"
          archive="$archive_dir/$filename"
          digest="$(node -e 'const fs=require("node:fs"),c=require("node:crypto");process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$archive")"
          node deploy/portable-install.mjs --stage --version "$version" --prefix "$prefix" --source "$archive" --sha256 "$digest"
          node deploy/portable-install.mjs --activate --version "$version" --prefix "$prefix"
          node "$prefix/bin/synrex.mjs" --version
          node deploy/portable-install.mjs --status --prefix "$prefix"
          node deploy/portable-service.mjs --plan --prefix "$prefix"
      - name: Windows first-use and background task acceptance
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'synrex-native-qa-install'
          node deploy/portable-service.mjs --write --prefix "$prefix"
          if ($LASTEXITCODE -ne 0) { throw 'Portable service file generation failed' }
          foreach ($file in @('start-synrex-logged.ps1', 'register-synrex-task.ps1')) {
            $path = Join-Path (Join-Path $prefix 'service') $file
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; throw "Invalid generated PowerShell: $file" }
          }
          $cli = Join-Path $prefix 'bin\synrex.mjs'
          $env:DEVSPACE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'synrex-first-use'
          $projects = Join-Path $env:RUNNER_TEMP 'Projects'
          New-Item -ItemType Directory -Path $projects -Force | Out-Null
          node $cli config roots add $projects
          if ($LASTEXITCODE -ne 0) { throw 'Add project root failed' }
          node $cli config roots list
          if ($LASTEXITCODE -ne 0) { throw 'List project roots failed' }
          # A scheduled task does not inherit this runner step's environment.
          # Give the temporary Windows runner user an isolated local Owner state.
          $ownerDir = Join-Path $env:USERPROFILE '.devspace'
          New-Item -ItemType Directory -Path $ownerDir -Force | Out-Null
          Copy-Item (Join-Path $env:DEVSPACE_CONFIG_DIR 'config.jsonc') (Join-Path $ownerDir 'config.jsonc') -Force
          '{"ownerToken":"ci-native-isolated-owner-long-enough"}' | Set-Content (Join-Path $ownerDir 'auth.json') -Encoding UTF8
          try {
            & (Join-Path $prefix 'service\register-synrex-task.ps1')
            $task = Get-ScheduledTask -TaskName Synrex.Portable -ErrorAction Stop
            if ($task.Settings.RestartCount -ne 20) { throw 'Task restart policy not installed' }
            if ($task.Actions.Count -ne 1) { throw 'Unexpected number of task actions' }
            Start-ScheduledTask -TaskName Synrex.Portable
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              $code = curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:7676/mcp
              if ($code -eq '401') { $healthy = $true; break }
            }
            if (-not $healthy) { throw 'Scheduled task did not start a protected MCP service' }
            Stop-ScheduledTask -TaskName Synrex.Portable
          } finally {
            Unregister-ScheduledTask -TaskName Synrex.Portable -Confirm:$false -ErrorAction SilentlyContinue
          }
