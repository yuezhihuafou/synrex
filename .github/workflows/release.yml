name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate release version
        id: release
        run: |
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(beta|rc)\.([1-9][0-9]*)$'
          source_version="$(node -p 'require("./package.json").version')"

          if [[ "$VERSION" != "$source_version" ]]; then
            echo "Requested version $VERSION does not match package.json $source_version." >&2
            exit 1
          fi

          if [[ "$VERSION" =~ $stable ]]; then
            is_prerelease=false
          elif [[ "$VERSION" =~ $prerelease ]]; then
            is_prerelease=true
          else
            echo "Unsupported release version: $VERSION" >&2
            echo "Use X.Y.Z, X.Y.Z-beta.N, or X.Y.Z-rc.N." >&2
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Require matching immutable annotated tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-parse "$TAG^{}")" = "$GITHUB_SHA"
          test -f "docs/releases/$TAG.md"

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | "\(.status):\(.conclusion)"')"
          if [[ "$state" != "completed:success" ]]; then
            echo "The exact release commit must have a successful main CI push run; got ${state:-no run}." >&2
            exit 1
          fi

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test:package-install
          pnpm audit --prod --audit-level high --registry https://registry.npmjs.org

      - name: Pack release artifact
        id: pack
        run: |
          mkdir -p .release
          filename="$(npm pack --silent --pack-destination .release | tail -n 1)"
          test -n "$filename"
          cmp pnpm-lock.yaml deploy/release-lock.yaml
          tar -tzf ".release/$filename" | grep -Fx 'package/deploy/release-lock.yaml'
          tar -tzf ".release/$filename" | grep -Fx 'package/pnpm-workspace.yaml'
          tar -tzf ".release/$filename" | grep -Fx 'package/SECURITY.md'
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "tarball=.release/$filename" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM and verified archive checksums
        env:
          ARCHIVE: ${{ steps.pack.outputs.filename }}
        run: |
          pnpm sbom --sbom-format=cyclonedx --prod > ".release/synrex-$VERSION.cdx.json"
          node -e 'const fs=require("node:fs");const sbom=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!sbom.bomFormat||!sbom.components?.length)throw Error("SBOM is empty or invalid");console.log("Validated CycloneDX component count:",sbom.components.length)' ".release/synrex-$VERSION.cdx.json"
          (cd .release && sha256sum "$ARCHIVE" "synrex-$VERSION.cdx.json" > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Attest built release archive provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi

          args=(release create "$TAG" "$TARBALL" ".release/synrex-$VERSION.cdx.json" ".release/SHA256SUMS" --title "$TAG" --verify-tag --notes-file "docs/releases/$TAG.md")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
